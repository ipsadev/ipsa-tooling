[package]
name = "scp-exporter"
version = "0.1.0"
edition = "2021"
rust-version = "1.81.0"
license = "Apache-2.0"
description = "Fetches Stellar SCP consensus evidence from history archives"
repository = "https://github.com/ipsadev/ipsa-tooling"

[dependencies]
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
stellar-xdr = { version = "30.0.0", features = ["std"] }
thiserror = "1"

[lints.rust]
unsafe_code = "forbid"
