[package]
name = "chain-check"
version = "0.1.0"
edition = "2021"
rust-version = "1.81.0"
license = "Apache-2.0"
description = "Independent cross-check of a Stellar ledger: separate XDR reader, ring instead of sha2 and ed25519-dalek"
repository = "https://github.com/ipsadev/ipsa-tooling"
publish = false

[lib]
name = "chain_check"
path = "src/lib.rs"

[[bin]]
name = "chain-check"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1"
hex = "0.4"
ring = "0.17"
serde_json = "1"
ureq = "2.10"

[lints.rust]
unsafe_code = "forbid"
