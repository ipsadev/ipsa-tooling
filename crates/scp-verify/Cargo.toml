[package]
name = "scp-verify"
version = "0.1.1"
edition = "2021"
rust-version = "1.81.0"
license = "Apache-2.0"
description = "Independently verify Stellar SCP consensus for a single ledger, step by step"
repository = "https://github.com/ipsadev/ipsa-tooling"

[lib]
name = "scp_verify"
path = "src/lib.rs"

[[bin]]
name = "scp-verify"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["io", "dep:clap", "serve"]
serve = ["io", "dep:axum"]
io = ["dep:tokio", "dep:futures"]

[dependencies]
scp-exporter = { path = "../scp-exporter", version = "0.1.0" }
stellar-consensus-verifier = "2.3.0"
clap = { version = "4.5", features = ["derive"], optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"], optional = true }
futures = { version = "0.3", optional = true }
ed25519-dalek = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stellar-strkey = "0.0.13"
stellar-xdr = { version = "30.0.0", features = ["std"] }
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = 2 }

[lints.clippy]
use_self = "warn"
