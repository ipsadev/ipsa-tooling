name: release

on:
  push:
    tags:
      - "scp-exporter-v*"
      - "scp-verify-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "crate tag to publish (e.g. scp-exporter-v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.tag }}

jobs:
  publish:
    name: publish ${{ github.event.inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: install rust
        run: rustup toolchain install stable --profile minimal

      - name: derive the crate and version from the tag
        run: |
          echo "CRATE=${TAG%-v*}" >> "$GITHUB_ENV"
          echo "VERSION=${TAG##*-v}" >> "$GITHUB_ENV"

      - name: the tag must match the crate version
        run: |
          manifest="crates/${CRATE}/Cargo.toml"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' "$manifest" | head -1)"
          if [ "$version" != "$VERSION" ]; then
            echo "tag ${TAG} does not match ${manifest} version ${version}" >&2
            exit 1
          fi

      - name: test the crate
        run: cargo test --locked -p "$CRATE"

      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p "$CRATE"
